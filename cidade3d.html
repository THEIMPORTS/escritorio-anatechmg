<script type="module">

/* ===== CIDADE: chão, prédios, ruas, aeronaves ===== */

// estrelas
(function(){
  var sg=new THREE.BufferGeometry(),pts=[];
  for(var st=0;st<900;st++){
    var a=Math.random()*Math.PI*2,e=Math.random()*Math.PI*.48,r2=1300;

      if(disp.length<2)return;
      var A=disp[Math.floor(Math.random()*disp.length)];
      var B=disp[Math.floor(Math.random()*disp.length)];
      if(A===B)return;
      A.userData.est='indo';B.userData.est='falando';
      A.userData.alvo=B.position.clone();
      A.userData.par=B;
      var fala=(A.userData.ag.ultima_acao&&A.userData.ag.ultima_acao!=='None'&&String(A.userData.ag.ultima_acao).trim())?String(A.userData.ag.ultima_acao):AMBIENTE[Math.floor(Math.random()*AMBIENTE.length)];
      A.userData.pendente=fala;
    },4200+Math.random()*2600);
  });
}

/* ===== dados + montagem ===== */
var andarAtivo=null,tween=null;
pegaAgents().then(function(dados){
  var lista=(dados.agentes||dados||[]).filter(function(a){return a&&a.nome});
  document.getElementById('nAg').textContent=lista.length;
  var chips='';
  var cont={};
  lista.forEach(function(a){
    var zk=zoneOf(a.nome,a.papel);
    (agentesPorZona[zk]=agentesPorZona[zk]||[]).push(a);
    cont[zk]=(cont[zk]||0)+1;
  });
  ORDEM.forEach(function(zk){
    if(!agentesPorZona[zk])return;
    chips+='<span class="chip3" data-zona="'+zk+'"><i style="background:'+ZONAS[zk].cor+'"></i>'+ZONAS[zk].nome+' · '+cont[zk]+'</span>';
  });
  document.getElementById('chips').innerHTML=chips;
  document.querySelectorAll('.chip3[data-zona]').forEach(function(c){
    c.addEventListener('click',function(){entraAndar(c.getAttribute('data-zona'))});
  });
  // constrói andares e humanos
  ORDEM.forEach(function(zk){
    if(!agentesPorZona[zk])return;
    buildAndar(zk,agentesPorZona[zk]);
    var g=grupos[zk];
    agentesPorZona[zk].forEach(function(a,i){
      var h=fazHumano(a,ZONAS[zk].cor);
      var ang=Math.random()*Math.PI*2,rad=2+Math.random()*8;
      h.position.set(Math.cos(ang)*rad,0,Math.sin(ang)*rad);
      h.userData.baseY=g.position.y;
      g.add(h);agentes.push(h);
    });
    g.visible=false;
  });
  agendaConversas();
  document.getElementById('load').style.display='none';
  // deep link
  var qs=new URLSearchParams(location.search).get('andar');
  if(qs&&grupos[qs])setTimeout(function(){entraAndar(qs)},1200);
}).catch(function(e){
  document.getElementById('load').innerHTML='<div style="color:#f87171;font-size:13px">erro ao carregar agentes: '+e+'</div>';
});

/* ===== navegação: geral ↔ andar ===== */
function camTween(pos,tgt,dur){
  var p0=camera.position.clone(),t0=controls.target.clone(),st=performance.now();
  tween=function(now){
    var k=Math.min(1,(now-st)/dur),e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(p0,pos,e);
    controls.target.lerpVectors(t0,tgt,e);
    if(k>=1)tween=null;
  };
}
function entraAndar(zk){
  if(andarAtivo===zk)return;
  if(andarAtivo&&grupos[andarAtivo])grupos[andarAtivo].visible=false;
  andarAtivo=zk;
  var g=grupos[zk];g.visible=true;
  var y=g.position.y;
  camTween(new THREE.Vector3(0,y+4.2,10.5),new THREE.Vector3(0,y+.9,0),1400);
  controls.minDistance=2.5;controls.maxDistance=40;
  document.getElementById('andarBar').style.display='flex';
  document.getElementById('andarNome').textContent=ZONAS[zk].nome;
  document.getElementById('dica').textContent='🤖 '+ZONAS[zk].nome+' — clique num agente pra ver a ficha e atribuir função';
  marcaChip(zk);
}
function visaoGeral(){
  if(andarAtivo&&grupos[andarAtivo])grupos[andarAtivo].visible=false;
  andarAtivo=null;fechaCarta();
  camTween(new THREE.Vector3(150,95,190),new THREE.Vector3(0,42,0),1500);
  controls.minDistance=8;controls.maxDistance=420;
  document.getElementById('andarBar').style.display='none';
  document.getElementById('dica').textContent='🖱️ gire a cidade · clique num andar da torre ou num chip pra visitar o setor · clique num agente pra ver a ficha';
  marcaChip(null);
}
function marcaChip(zk){
  document.querySelectorAll('.chip3[data-zona]').forEach(function(c){
    c.classList.toggle('on',c.getAttribute('data-zona')===zk);
  });
}
window.visaoGeral=visaoGeral;window.entraAndar=entraAndar;

/* ===== ficha do agente (HTML) ===== */
var selAg=null;
function abreCarta(ag){
  selAg=ag;
  var a=ag.userData.ag,zk=ag.userData.zona;
  var stc=STCOR[a.status]||'#22c55e';
  var ua=(a.ultima_acao&&a.ultima_acao!=='None')?String(a.ultima_acao):'sem atividade registrada ainda';
  document.getElementById('cBody').innerHTML=
    '<div style="font-size:22px">'+(a.emoji||'🤖')+'</div>'+
    '<h3>'+a.nome+'</h3><div class="pp">'+String(a.papel||'')+'</div>'+
    '<span class="st" style="background:'+(stc+'22')+';color:'+stc+';border:1px solid '+stc+'">'+String(a.status||'ativo').toUpperCase()+'</span>'+
    '<div style="font-size:10px;color:#7fa4d9;letter-spacing:1px;margin-top:8px;font-weight:700">SETOR · '+ZONAS[zk].nome+'</div>'+
    '<div class="ua">'+ua+'</div>'+
    '<label>ATRIBUIR FUNÇÃO A ESTE AGENTE</label>'+
    '<input id="fnIn" placeholder="ex.: preparar relatório semanal">'+
    '<button id="fnBtn">🚀 ATRIBUIR FUNÇÃO</button>';
  var ct=document.getElementById('carta');ct.style.display='block';
  document.getElementById('fnBtn').onclick=function(){
    var fn=document.getElementById('fnIn').value.trim();if(!fn)return;
    fetch('https://ana-a391f94e.base44.app/functions/opsOffice',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({acao:'atribuir',agente:a.nome,funcao:fn})})
      .then(function(r){return r.json()})
      .then(function(r2){
        mostraFala(ag,'função atribuída: '+fn);
        abreCarta(ag); // recarrega com última ação nova
      });
  };
}
function fechaCarta(){document.getElementById('carta').style.display='none';}
window.fechaCarta=fechaCarta;

/* ===== raycast: clique em laje (andar) ou agente ===== */
var ray=new THREE.Raycaster(),mx=new THREE.Vector2(),down=null;
renderer.domElement.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY}});
renderer.domElement.addEventListener('pointerup',function(e){
  if(!down)return;
  if(Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y)>6){down=null;return;}
  mx.x=(e.clientX/innerWidth)*2-1;mx.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mx,camera);
  if(andarAtivo){
    var visiveis=[];
    grupos[andarAtivo].traverse(function(o){if(o.userData&&o.userData.ag)visiveis.push(o)});
    var hit=ray.intersectObjects(visiveis,true)[0];
    if(hit){
      var obj=hit.object;while(obj&&!(obj.userData&&obj.userData.ag))obj=obj.parent;
      if(obj){abreCarta(obj);return;}
    }
  } else {
    var hl=ray.intersectObjects(lajes,false)[0];
    if(hl){entraAndar(hl.object.userData.zona);}
  }
  down=null;
});

/* ===== loop ===== */
var relogio=new THREE.Clock();
function anima(){
  requestAnimationFrame(anima);
  var dt=Math.min(relogio.getDelta(),.05),t=relogio.elapsedTime;
  if(tween)tween(performance.now());
  // aeronaves orbitam
  for(var vi=0;vi<NV;vi++){
    var v=voo[vi];v.ph+=v.spd;
    var x=Math.cos(v.ph)*v.rad,z=Math.sin(v.ph)*v.rad;
    var y=v.alt+Math.sin(t*.6+vi)*1.6;
    m4.compose(new THREE.Vector3(x,y,z),q0,s3.set(1,1,1));
    vIns.setMatrixAt(vi,m4);
  }
  vIns.instanceMatrix.needsUpdate=true;
  // topos piscam
  topos.forEach(function(tp,ti){tp.material.color.offsetHSL(0,0,0);tp.scale.setScalar(1+Math.sin(t*2+ti)*.12);});
  // anéis hologramas giram
  holoRings.forEach(function(hr,hi){hr.rotation.z+=dt*(.3+hi*.15);hr.position.y=ORDEM.length*FANDAR+16+Math.sin(t+hi)*1.2;});
  logoH.position.y=ORDEM.length*FANDAR+16+Math.sin(t*.8)*.8;
  feixe.material.opacity=.09+Math.sin(t*1.3)*.04;
  // agentes: andar / vagar / ir conversar
  agentes.forEach(function(ag){
    var u=ag.userData;
    ag.children.forEach(function(c){});
    if(u.est==='indo'&&u.alvo){
      var d=u.alvo.clone().sub(ag.position);d.y=0;
      if(d.length()<1.3){
        u.est='falando';u.timer=4.5;
        mostraFala(ag,u.pendente||AMBIENTE[0]);
        if(u.par){u.par.lookAt(ag.position);}
      } else {
        d.normalize();ag.position.addScaledVector(d,u.vel*dt);
        ag.lookAt(u.alvo.x,ag.position.y,u.alvo.z);
        ag.position.y=Math.abs(Math.sin(t*9))*.06; // passo
      }
    } else if(u.est==='falando'){
      u.timer-=dt;
      ag.position.y=Math.sin(t*5)*.02;
      if(u.timer<=0){u.est='livre';u.alvo=null;u.par=null;}
    } else if(u.est==='livre'){
      u.timer-=dt;
      ag.position.y=Math.abs(Math.sin(t*3.2+ag.id))*.03;
      if(u.timer<=0){
        u.timer=3+Math.random()*7;
        if(Math.random()<.5){
          var ang=Math.random()*Math.PI*2,rad=2+Math.random()*9;
          u.alvo=new THREE.Vector3(Math.cos(ang)*rad,0,Math.sin(ang)*rad);
          u.est='passeio';
        }
      }
    } else if(u.est==='passeio'&&u.alvo){
      var d2=u.alvo.clone().sub(ag.position);d2.y=0;
      if(d2.length()<.4){u.est='livre';u.alvo=null;}
      else{d2.normalize();ag.position.addScaledVector(d2,u.vel*.6*dt);ag.lookAt(u.alvo.x,ag.position.y,u.alvo.z);ag.position.y=Math.abs(Math.sin(t*9))*.05;}
    }
  });
  controls.update();
  renderer.render(scene,camera);
}
anima();
addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
