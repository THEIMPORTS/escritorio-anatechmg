function atualizaHolograma(){
  const r=SALAS.find(s=>s.trade);if(!r||!r.supHolo||!dados.cripto||!dados.cripto.sup)return;
  const iv=dados.cripto.sup.iv;if(!iv.length||!iv[0].length)return;
  const nE=iv.length,nS=iv[0].length;
  const pos=[],cor=[],idx=[];
  for(let e2=0;e2<nE;e2++)for(let si=0;si<nS;si++){
    const v=iv[e2][si]||0;const t2=Math.max(0,Math.min(1,(v-15)/70));
    pos.push((si/(nS-1)-.5)*2.1, v/100*.85, (e2/(nE-1)-.5)*1.1);
    cor.push(t2, .35+t2*.5, 1-t2*.65);
    if(si<nS-1&&e2<nE-1){const a=e2*nS+si,b=a+1,c2=a+nS,d=c2+1;idx.push(a,b,d,a,d,c2);}
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(cor,3));
  geo.setIndex(idx);
  r.supHolo.children[0].geometry.dispose();r.supHolo.children[0].geometry=geo;
  r.supHolo.children[1].geometry.dispose();r.supHolo.children[1].geometry=geo;
}

const CABELOS=[0x18120c,0x2a1b10,0x0d0d0d,0x3a2a16,0x1c1c20];
function humano(r,idx,fem){
  const camisa=r.camisa, pele=PELES[idx%PELES.length], cabelo=CABELOS[(idx+2)%CABELOS.length];
  const mPel=mat({color:pele,roughness:.55});
  const mCab=mat({color:cabelo,roughness:.85});
  const mCam=mat({color:camisa,roughness:.7});
  const mCal=mat({color:fem?0x23283a:0x1b1e26,roughness:.8});
  const g=new THREE.Group();
  const quadril=new THREE.Group();quadril.position.y=.96;g.add(quadril);
  const tor=new THREE.Mesh(new THREE.CapsuleGeometry(.155,.32,6,14),mCam);tor.position.y=.34;quadril.add(tor);
  const col=box(.34,.1,.2,{color:camisa,roughness:.7});col.position.y=.58;quadril.add(col);
  const pesc=new THREE.Mesh(new THREE.CylinderGeometry(.05,.055,.09,10),mPel);pesc.position.y=.68;quadril.add(pesc);
  const cabG=new THREE.Group();cabG.position.y=.74;quadril.add(cabG);
  const cab=new THREE.Mesh(new THREE.SphereGeometry(.105,20,16),mPel);cabG.add(cab);
  const chl=new THREE.Mesh(new THREE.SphereGeometry(.11,20,12,0,Math.PI*2,0,Math.PI*.52),mCab);chl.position.y=.015;cabG.add(chl);
  if(fem){const lk=new THREE.Mesh(new THREE.CylinderGeometry(.075,.05,.34,10),mCab);lk.position.set(0,-.09,-.06);cabG.add(lk);}
  [-1,1].forEach(ex=>{const ol=new THREE.Mesh(new THREE.SphereGeometry(.013,8,8),mat({color:0x101014,roughness:.3}));ol.position.set(ex*.036,.012,.094);cabG.add(ol);});
  const sombr=new THREE.Mesh(new THREE.SphereGeometry(.012,8,8),mPel);sombr.position.set(0,-.02,.102);cabG.add(sombr);
  function braco(ex){
    const ombro=new THREE.Group();ombro.position.set(ex*.225,.52,0);quadril.add(ombro);
    const sup=new THREE.Mesh(new THREE.CapsuleGeometry(.05,.18,4,10),mCam);sup.position.y=-.14;ombro.add(sup);
    const cot=new THREE.Group();cot.position.y=-.3;ombro.add(cot);
    const ant=new THREE.Mesh(new THREE.CapsuleGeometry(.043,.16,4,10),mPel);ant.position.y=-.12;cot.add(ant);
    const mao=new THREE.Mesh(new THREE.SphereGeometry(.042,10,8),mPel);mao.position.y=-.26;cot.add(mao);
    return {ombro,cot};
  }
  const bE=braco(-1),bD=braco(1);
  function perna(ex){
    const piv=new THREE.Group();piv.position.set(ex*.09,-.02,0);quadril.add(piv);
    const cox=new THREE.Mesh(new THREE.CapsuleGeometry(.068,.24,4,10),mCal);cox.position.y=-.2;piv.add(cox);
    const joel=new THREE.Group();joel.position.y=-.42;piv.add(joel);
    const can=new THREE.Mesh(new THREE.CapsuleGeometry(.052,.22,4,10),mCal);can.position.y=-.17;joel.add(can);
    const pe=box(.11,.06,.25,{color:0x101014,roughness:.5});pe.position.set(0,-.42,.045);joel.add(pe);
    return {piv,joel};
  }
  const pE=perna(-1),pD=perna(1);
  g.userData={quadril,cabG,cab,bE,bD,pE,pD,tor,fem,fase:idx*1.37};
  return g;
}

SALAS.forEach((r,idx)=>{
  const side=idx%2===0?-1:1;                 // -1 esquerda | +1 direita
  const z=-16.5+Math.floor(idx/2)*8.4;       // 5 profundidades por lado
  const doorX=side*(CORR/2);                 // vidro junto ao corredor
  const cx=side*(CORR/2+RD/2);               // centro x da sala
  const dirIn=side*-1;                        // sentido corredor→sala = +side
  /* piso elevado da sala */
  const tap=box(RD,.12,RW,{color:r.tapete,roughness:.9});tap.position.set(cx,-.05,z);scene.add(tap);
  /* paredes laterais da sala (ao longo de x) */
  [-1,1].forEach(sz=>{
    const w=box(RD,ALT,.22,{color:0x20232b,roughness:.92});
    w.position.set(cx,ALT/2,z+sz*(RW/2));scene.add(w);
  });
  /* teto da sala */
  const t2=box(RD,.16,RW,{color:0x14171e,roughness:.9});t2.position.set(cx,ALT+.04,z);scene.add(t2);
  const painel=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,RW-1.8),mat({color:0xffffff,emissive:0xe8f2ff,emissiveIntensity:1.8}));
  painel.position.set(cx,ALT-.12,z);scene.add(painel);
  lit(0xfff6e8,.55,9,cx,ALT-.5,z);
  /* vidro + moldura da frente */
  const vidro=new THREE.Mesh(new THREE.PlaneGeometry(RW-.1,ALT-.35),vidroMat);
  vidro.position.set(doorX,ALT/2,z);vidro.rotation.y=Math.PI/2;scene.add(vidro);
  [[0,ALT-.05,RW],[0,.08,RW]].forEach(p=>{const b=box(.14,.1,p[2],{color:0x101318,roughness:.4,metalness:.6});b.position.set(doorX,p[1],z);scene.add(b)});
  [-1,0,1].forEach(sz=>{const b=box(.14,ALT,.14,{color:0x101318,roughness:.4,metalness:.6});b.position.set(doorX,ALT/2,z+sz*(RW/2-.07));scene.add(b)});
  /* placa com nome (voltada pro corredor) */
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.7,.42),new THREE.MeshBasicMaterial({map:placaTx(r.nome.toUpperCase())}));
  pl.position.set(doorX-side*.02,ALT-.62,z);pl.rotation.y=-side*Math.PI/2;scene.add(pl);
  sombra(cx,z,RW);

  /* --- layout por equipe: N mesas, N cadeiras, N agentes --- */
  const deskX=side*(EXT-.55);
  const eq=r.equipe||[{n:r.nome,c:r.cargo}];
  const multi=eq.length>1;
  const dzs=multi?[-1.95,-.65,.65,1.95]:[0];
  function cadeira(x,zz,rot){const cad=new THREE.Group();
    const assento=box(.5,.08,.48,{color:0x101318,roughness:.6});assento.position.y=.48;
    const encosto=box(.48,.55,.08,{color:0x101318,roughness:.6});encosto.position.set(0,.95,.24);
    const colC=box(.06,.4,.06,{color:0x15181f,roughness:.3,metalness:.8});colC.position.y=.3;
    const basC=new THREE.Mesh(new THREE.CylinderGeometry(.26,.3,.05,14),mat({color:0x15181f,roughness:.3,metalness:.8}));basC.position.y=.05;
    cad.add(assento,encosto,colC,basC);cad.position.set(x,0,zz);cad.rotation.y=rot;scene.add(cad);}
  if(multi){
    dzs.forEach(dz=>{const d=box(1.15,.06,1.35,{color:0x6b4a2f,roughness:.4});d.position.set(deskX,.74,z+dz);scene.add(d);
      [-.55,.55].forEach(sz=>{const pe=box(.9,.72,.06,{color:0x15181f,roughness:.3,metalness:.8});pe.position.set(deskX,.37,z+dz+sz);scene.add(pe)});});
  }else{
    const d=box(1.15,.06,2.9,{color:0x6b4a2f,roughness:.4});d.position.set(deskX,.74,z);scene.add(d);
    [-1.2,1.2].forEach(sz=>{const pe=box(.9,.72,.06,{color:0x15181f,roughness:.3,metalness:.8});pe.position.set(deskX,.37,z+sz);scene.add(pe)});
  }
  /* telas: trade = 4 abas diferentes + tela de parede; demais = 1 tela compartilhada */
  const texs=[],ctxs=[];
  for(let k=0;k<dzs.length;k++){
    let scr;
    if(r.trade){scr=novaTela(['MERCADO','CADEIA','CARTEIRA','TRADES'][k]);}
    else{if(!texs.length)scr=desenhaTela(r);else scr={tex:texs[0],ctx:ctxs[0]};}
    scene.add(monitor(scr.tex,deskX-side*.06,1.22,z+dzs[k],-side*Math.PI/2));
    if(!texs.includes(scr.tex)){texs.push(scr.tex);ctxs.push(scr.ctx);}
  }
  if(!multi&&!r.trade){scene.add(monitor(texs[0],deskX-side*.06,1.22,z+1.11,-side*Math.PI/2));}
  r.texs=texs;r.ctxs=ctxs;
  /* acessórios por mesa */
  dzs.forEach(dz=>{const teclado=box(.44,.02,.16,{color:0x0f1218,roughness:.5});teclado.position.set(deskX-side*.42,.78,z+dz);teclado.rotation.y=-side*Math.PI/2;scene.add(teclado);
    const mouse=box(.08,.03,.13,{color:0x0f1218,roughness:.5});mouse.position.set(deskX-side*.42,.78,z+dz+.25);scene.add(mouse);});
  dzs.forEach((dz,ii)=>{if(ii%3)return;const caneca=new THREE.Mesh(new THREE.CylinderGeometry(.04,.035,.09,12),mat({color:0xFF8100,roughness:.35}));caneca.position.set(deskX,.82,z+dz+.55);scene.add(caneca);});
  /* cadeiras */
  dzs.forEach(dz=>cadeira(deskX-side*1.1,z+dz,side*Math.PI/2));
  /* equipe de agentes */
  const agentesSala=[];
  eq.forEach((m,i)=>{
    const av=humano({camisa:r.camisa},idx*4+i,m.f);
    av.position.set(deskX-side*1.15,0,z+dzs[i]);av.rotation.y=side*Math.PI/2;scene.add(av);
    agentesSala.push({avatar:av,nome:m.n,cargo:m.c,
      deskPos:[deskX-side*1.15,z+dzs[i]],
      anSt:{modo:Math.random()<.5?'digita':'para',tmr:1+Math.random()*6,alvo:null,fim:null,passo:0,waveEm:-1,waveAte:-1}});
  });
  /* sala de trade: tela de parede + superfície de volatilidade holográfica */
  if(r.trade){
    const wall=novaTela('SUPERFÍCIE DE VOLATILIDADE');
    r.wallTex=wall.tex;r.wallCtx=wall.ctx;
    const wg=new THREE.Group();
    const wf=box(.06,2.1,3.5,{color:0x0a0c10,roughness:.3,metalness:.5});
    const ws=new THREE.Mesh(new THREE.PlaneGeometry(1.9,3.3),new THREE.MeshBasicMaterial({map:wall.tex}));
    ws.position.x=-.04;ws.rotation.y=-Math.PI/2;
    wg.add(wf,ws);wg.position.set(side*(EXT-.18),2.0,z);scene.add(wg);
    /* holograma: grade strikes x vencimentos, altura = IV */
    const hg=new THREE.Group();
    const supGeo=new THREE.BufferGeometry();
    hg.add(new THREE.Mesh(supGeo,new THREE.MeshBasicMaterial({wireframe:true,vertexColors:true,transparent:true,opacity:.9})));
    hg.add(new THREE.Mesh(supGeo,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.12,side:THREE.DoubleSide})));
    const disc=new THREE.Mesh(new THREE.CircleGeometry(1.5,40),new THREE.MeshBasicMaterial({map:sombraTex,transparent:true,opacity:.5,depthWrite:false,color:0x009CFE}));
    disc.rotation.x=-Math.PI/2;disc.position.y=-.55;hg.add(disc);
    hg.position.set(side*7.2,1.75,z);scene.add(hg);
    r.supHolo=hg;
  }
  /* plantas nos cantos */
  planta(side*(EXT-.9),z+RW/2-.8,.9);
  planta(side*(EXT-.9),z-RW/2+.8,.7);

  const deskPos=[deskX-side*1.15,z];
  const wps=[[deskX-side*1.9,z-1.5],[deskX-side*1.9,z+1.5],[doorX+side*1.1,z-1.2],[doorX+side*1.1,z+1.2]];
  salas3d.push({def:r,z,cx,side,deskX,agentes:agentesSala,deskPos,wps,
    camPos:new THREE.Vector3(side*(CORR/2+1.6),1.62,z),
    camTarget:new THREE.Vector3(deskX,1.05,z)});
});

function abreFala(s){chatSel=s.def;document.getElementById('falaTitulo').textContent='FALAR COM '+s.def.nome.toUpperCase();fala.classList.add('on');
  if(!chatHist[s.def.chat])chatHist[s.def.chat]=[];renderHist()}

document.getElementById('falaForm').addEventListener('submit',async e=>{
  e.preventDefault();const inp=document.getElementById('falaIn');const t=inp.value.trim();if(!t||!chatSel)return;
  inp.value='';chatHist[chatSel.chat].push({de:'eu',texto:t});renderHist();
  falaHist.insertAdjacentHTML('beforeend','<div class="m ag">…</div>');falaHist.scrollTop=1e6;
  try{
    const r=await fetch(CHAT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agente:chatSel.chat,mensagem:t,historico:chatHist[chatSel.chat].slice(-6)})});
    const d=await r.json();const resp=d.resposta||'(sem resposta, chama a diretoria)';
    chatHist[chatSel.chat].push({de:'ag',texto:resp});
  }catch(err){chatHist[chatSel.chat].push({de:'ag',texto:'(erro de conexão, tenta de novo)'})}

const clock=new THREE.Clock();

const angLerp=(a,b,k)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*k;};
function atualizaAgente(s,ag,dt,t){
  const g=ag.avatar,u=g.userData,st=ag.anSt;if(!st)return;
  const f=u.fase;
  const olhaCam=salaAtiva===s;
  const hx=g.position.x,hz=g.position.z;
  if(t>=st.waveEm&&t<=st.waveAte){
    const ang=Math.atan2(camera.position.x-hx,camera.position.z-hz);
    g.rotation.y=angLerp(g.rotation.y,ang,.15);
    u.bD.ombro.rotation.x=angLerp(u.bD.ombro.rotation.x,-2.5,.2);
    u.bD.cot.rotation.x=-.4+Math.sin(t*7)*.4;
    u.bE.ombro.rotation.x=angLerp(u.bE.ombro.rotation.x,0,.2);u.bE.cot.rotation.x=angLerp(u.bE.cot.rotation.x,-.2,.2);
    u.cabG.rotation.y=angLerp(u.cabG.rotation.y,0,.1);u.cabG.rotation.x=angLerp(u.cabG.rotation.x,0,.1);
    return;
  }
  if(st.modo==='anda'){
    const dx=st.alvo[0]-hx,dz=st.alvo[1]-hz,dist=Math.hypot(dx,dz);
    const ang=Math.atan2(dx,dz);
    g.rotation.y=angLerp(g.rotation.y,ang,.18);
    const avanca=Math.min(.85*dt,dist);st.passo+=avanca*7.5;
    if(dist<.12){g.position.x=st.alvo[0];g.position.z=st.alvo[1];st.modo=st.fim;st.tmr=st.fim==='digita'?4+Math.random()*5:(st.fim==='fone'?3+Math.random()*3:2+Math.random()*3);zerarPose(u);}
    else{g.position.x+=dx/dist*avanca;g.position.z+=dz/dist*avanca;u.quadril.position.y=.96+Math.abs(Math.sin(st.passo))*.03;}
    const ph=st.passo;
    u.pE.piv.rotation.x=Math.sin(ph)*.55;u.pD.piv.rotation.x=Math.sin(ph+Math.PI)*.55;
    u.pE.joel.rotation.x=Math.max(0,Math.sin(ph+2.6))*.65;u.pD.joel.rotation.x=Math.max(0,Math.sin(ph+Math.PI+2.6))*.65;
    u.bE.ombro.rotation.x=Math.sin(ph+Math.PI)*.32;u.bD.ombro.rotation.x=Math.sin(ph)*.32;
    u.bE.cot.rotation.x=-.25;u.bD.cot.rotation.x=-.25;
    u.cabG.rotation.x=.04;u.cabG.rotation.y=angLerp(u.cabG.rotation.y,0,.1);
    u.tor.rotation.x=.05;
  }else if(st.modo==='digita'){
    u.bE.ombro.rotation.x=-.5;u.bD.ombro.rotation.x=-.5;
    u.bE.cot.rotation.x=-.95+Math.sin(t*8+f)*.09;u.bD.cot.rotation.x=-.95+Math.sin(t*8+f+1.4)*.09;
    u.pE.piv.rotation.x=u.pD.piv.rotation.x=0;u.pE.joel.rotation.x=u.pD.joel.rotation.x=0;
    u.quadril.position.y=.96+Math.sin(t*1.6+f)*.004;
    u.cabG.rotation.x=.1+Math.sin(t*1.3+f)*.03;
    u.cabG.rotation.y=olhaCam?angLerp(u.cabG.rotation.y,angPara(g,camera.position),.06):Math.sin(t*.35+f)*.22;
    u.tor.rotation.x=0;
  }else if(st.modo==='fone'){
    u.bD.ombro.rotation.x=-.15;u.bD.cot.rotation.x=-2.25;
    u.bE.ombro.rotation.x=-.35+Math.sin(t*2.4+f)*.1;u.bE.cot.rotation.x=-1.1+Math.sin(t*3.1+f)*.2;
    u.pE.piv.rotation.x=u.pD.piv.rotation.x=0;u.pE.joel.rotation.x=u.pD.joel.rotation.x=0;
    u.quadril.position.y=.96+Math.sin(t*1.2+f)*.005;
    u.cabG.rotation.z=.07;u.cabG.rotation.x=.02;
    u.cabG.rotation.y=olhaCam?angLerp(u.cabG.rotation.y,angPara(g,camera.position),.06):Math.sin(t*.5+f)*.3;
    u.tor.rotation.x=0;
  }else{
    zerarPose(u);
    u.quadril.position.y=.96+Math.sin(t*1.1+f)*.006;
    u.cabG.rotation.x=.05;u.cabG.rotation.z=Math.sin(t*.6+f)*.05;
    u.cabG.rotation.y=olhaCam?angLerp(u.cabG.rotation.y,angPara(g,camera.position),.06):Math.sin(t*.3+f)*.35;
    if(st.tmr>2)u.bE.cot.rotation.x=-.6+Math.sin(t*1.5)*.08;
  }
  st.tmr-=dt;
  if(st.tmr<=0&&st.modo!=='anda'){prox(s,ag,t);}
}
function angPara(g,p){const a=Math.atan2(p.x-g.position.x,p.z-g.position.z)-g.rotation.y;let d=a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return Math.max(-.9,Math.min(.9,d));}
function zerarPose(u){
  u.bE.ombro.rotation.x=u.bD.ombro.rotation.x=0;u.bE.cot.rotation.x=u.bD.cot.rotation.x=0;
  u.pE.piv.rotation.x=u.pD.piv.rotation.x=0;u.pE.joel.rotation.x=u.pD.joel.rotation.x=0;
  u.tor.rotation.x=0;u.cabG.rotation.z=0;u.quadril.position.y=.96;
}
function prox(s,ag,t){
  const st=ag.anSt,r=Math.random();
  if(r<.42){st.modo='anda';st.alvo=ag.deskPos;st.fim='digita';}
  else if(r<.68){st.modo='anda';st.alvo=s.wps[Math.floor(Math.random()*s.wps.length)];st.fim=Math.random()<.45?'fone':'para';}
  else if(r<.85){st.modo='fone';st.tmr=3+Math.random()*3;}
  else{st.modo='para';st.tmr=2+Math.random()*3;}
  if(st.modo==='fone'||st.modo==='para')zerarPose(ag.avatar.userData);
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(.35,clock.getDelta()),t=clock.elapsedTime;
  salas3d.forEach(s=>{s.agentes.forEach(ag=>atualizaAgente(s,ag,dt,t));});
  const tr=SALAS.find(x=>x.trade);if(tr&&tr.supHolo)tr.supHolo.rotation.y+=dt*.3;
  if(voando){
    const k=Math.min(1,(performance.now()-vooInicio)/1700);
    const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(vooDe.c,alvoCam,e);
    controls.target.lerpVectors(vooDe.t,alvoTgt,e);
    camera.lookAt(controls.target);
    if(k>=1){voando=false;controls.enabled=true;controls.update()}
  }else{controls.update()}
  composer.render();
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});

carregaTrade();setInterval(carregaTrade,45000);
carregaCripto();setInterval(carregaCripto,60000);
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),900);mostraCard(LOBBY);mark(btnLobby)},600);
</script>
