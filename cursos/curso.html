<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curso — ANATECH MG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--marinho:#001336;--azul:#009CFE;--laranja:#FF8100;--papel:#F5F5F3;--tinta:#101828;--cinza:#5A6072;--linha:#DAD6CD}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Poppins,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
header.topo{position:sticky;top:0;z-index:50;background:rgba(245,245,243,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
header.topo .wrap{display:flex;align-items:center;gap:16px;height:64px}
header img{height:28px}
header .volta{margin-left:auto;font-size:13px;color:var(--cinza)}
header .volta:hover{color:var(--azul)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:2px;font-weight:600;font-size:13.5px;padding:12px 18px;border:1px solid transparent;cursor:pointer;transition:.18s}
.btn.laranja{background:var(--laranja);color:var(--marinho)}
.btn.marinho{background:var(--marinho);color:#fff}
.btn.linha{border-color:var(--marinho);color:var(--marinho)}
.btn.linha:hover{background:var(--marinho);color:#fff}
.btn.azul{background:var(--azul);color:#fff}
.hero{background:var(--marinho);color:#fff;padding:52px 0 46px}
.hero .area{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--azul);font-weight:600;margin-bottom:12px}
.hero h1{margin:0 0 14px;font-size:clamp(27px,3.8vw,42px);line-height:1.08;letter-spacing:-.028em}
.hero p{margin:0;color:#B9C4D6;font-size:14.5px;line-height:1.68;max-width:70ch;font-weight:300}
.hero .selos{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.selo{font-size:11px;letter-spacing:.09em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25);padding:7px 11px;color:#DCE5F2}
.corpo{padding:44px 0 70px;display:grid;grid-template-columns:1.55fr .95fr;gap:44px;align-items:start}
h2{font-size:19px;letter-spacing:-.02em;color:var(--marinho);margin:0 0 16px}
.aulas{list-style:none;margin:0;padding:0;counter-reset:a}
.aulas li{counter-increment:a;display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--linha);font-size:14px;color:#26324A;line-height:1.5}
.aulas li:before{content:counter(a,decimal-leading-zero);font-size:11px;font-weight:700;color:var(--laranja);min-width:22px;padding-top:3px;letter-spacing:.04em}
.entrega{background:#fff;border:1px solid var(--linha);padding:22px;margin-bottom:18px}
.entrega h3{margin:0 0 12px;font-size:14px;color:var(--marinho)}
.entrega .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #EFECE4;font-size:13px}
.entrega .item:first-of-type{border-top:0}
.entrega .item span{color:var(--cinza)}
.entrega .item a{color:var(--azul);font-weight:600;white-space:nowrap}
.compra{background:var(--branco,#fff);border:1px solid var(--linha);padding:22px;position:sticky;top:82px}
.compra .preco{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.compra .preco b{font-size:34px;letter-spacing:-.03em;color:var(--marinho)}
.compra .preco span{font-size:12.5px;color:var(--cinza)}
.compra ul{margin:16px 0 20px;padding:0;list-style:none;display:grid;gap:9px;font-size:12.8px;color:#33405A}
.compra ul li{display:flex;gap:9px}
.compra ul li:before{content:"";width:6px;height:6px;background:var(--azul);margin-top:6px;flex:none}
.compra .btn{width:100%;justify-content:center}
.compra small{display:block;margin-top:12px;font-size:11.5px;color:var(--cinza);line-height:1.5;text-align:center}
.vazio{padding:60px 0;text-align:center;color:var(--cinza)}
@media (max-width:900px){.corpo{grid-template-columns:1fr;gap:28px}.compra{position:static}}

.trilha{font:500 12px Poppins;color:#5A6072;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.trilha a{color:#12386B;text-decoration:none}
.trilha b{color:#001336}
.selo.forte{background:#001336;color:#fff;border-color:#001336}
.aprende{margin-bottom:34px}
.aprende ul{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;list-style:none;padding:0;margin:0}
.aprende li{position:relative;padding-left:24px;font-size:14.5px;line-height:1.5;color:#1A1F2B}
.aprende li:before{content:"";position:absolute;left:0;top:5px;width:14px;height:8px;border-left:2.5px solid #FF8100;border-bottom:2.5px solid #FF8100;transform:rotate(-45deg)}
.modulo-topo{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.modulo-topo span{font:600 12px Poppins;color:#5A6072}
.barra{height:6px;border-radius:99px;background:#E7E3D9;overflow:hidden;margin:10px 0 18px}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CFE,#FF8100);transition:width .3s ease}
.aulas li label{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.aulas .num{font:700 11px Poppins;color:#009CFE;padding-top:2px}
.aulas .tit{flex:1}
.aulas input{appearance:none;width:18px;height:18px;border:2px solid #C9C4B8;border-radius:6px;margin-top:1px;flex:none;cursor:pointer}
.aulas input:checked{background:#FF8100;border-color:#FF8100}
.aulas input:checked+.num+.tit{color:#8A8F9C;text-decoration:line-through}
.relacionados{background:#001336;padding:48px 0;margin-top:56px}
.relacionados h2{color:#fff;font-size:20px;margin-bottom:20px}
.rel-grade{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.rel{display:flex;flex-direction:column;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;text-decoration:none}
.rel img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top}
.rel div{padding:12px}
.rel b{display:block;color:#fff;font-size:13px;line-height:1.3}
.rel span{color:#9FB0CC;font-size:11.5px}
@media(max-width:900px){.aprende ul{grid-template-columns:1fr}.rel-grade{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <a href="index.html"><img src="assets/logo-anatechmg.png" alt="ANATECH MG"></a>
    <a class="volta" href="catalogo.html">← Catálogo</a>
  </div>
</header>

<div id="conteudo"></div>

<script>
const params = new URLSearchParams(location.search);
const slug = params.get('c') || '';
const alvo = document.getElementById('conteudo');
const brl = v => 'R$ ' + v.toFixed(2).replace('.', ',');
const cargaNum = h => parseInt(h||'20',10) || 20;
function ligarProgresso(slug, total){
  const CH='anatech_progresso_'+slug;
  let feito={};
  try{ feito=JSON.parse(localStorage.getItem(CH)||'{}'); }catch(e){}
  const boxes=[...document.querySelectorAll('#listaAulas input[data-aula]')];
  const txt=document.getElementById('progressoTxt'), barra=document.getElementById('progressoBarra');
  const pintar=()=>{
    const n=boxes.filter(b=>b.checked).length;
    if(txt) txt.textContent=n+' de '+total+' aulas';
    if(barra) barra.style.width=(total?Math.round(n*100/total):0)+'%';
  };
  boxes.forEach(b=>{
    b.checked=!!feito[b.dataset.aula];
    b.addEventListener('change',()=>{
      feito[b.dataset.aula]=b.checked;
      try{ localStorage.setItem(CH, JSON.stringify(feito)); }catch(e){}
      pintar();
    });
  });
  pintar();
}

Promise.all([
  fetch('dados.json').then(r=>r.json()),
  fetch('aulas.json').then(r=>r.json()).catch(()=>({}))
]).then(([dados, aulas])=>{
  const c = (dados.cursos||[]).find(x=>x.s===slug);
  if(!c){
    alvo.innerHTML = '<div class="wrap vazio"><h2>Curso não encontrado</h2><p>O endereço veio sem um curso válido.</p><p><a class="btn marinho" href="catalogo.html">Voltar ao catálogo</a></p></div>';
    return;
  }
  document.title = c.n + ' — ANATECH MG';
  const lista = aulas[slug] || c.t || [];
  const aulasHtml = lista.map((t,i)=>'<li><label><input type="checkbox" data-aula="'+i+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="tit">'+t+'</span></label></li>').join('') || '<li>Conteúdo em 12 aulas, com prática guiada em cada uma.</li>';
  const compra = 'comprar.html?c='+encodeURIComponent(c.s)+'&n='+encodeURIComponent(c.n);

  const carga = (c.h || '20') + ' horas';
  const nivel = cargaNum(c.h) <= 20 ? 'Iniciante' : (cargaNum(c.h) <= 60 ? 'Intermediário' : 'Avançado');
  const aprende = lista.slice(0,6).map(t=>'<li>'+t+'</li>').join('');
  const rel = (dados.cursos||[]).filter(x=>x.a===c.a && x.s!==c.s).slice(0,4);

  alvo.innerHTML = `
  <section class="hero">
    <div class="wrap">
      <nav class="trilha"><a href="index.html">Início</a><span>/</span><a href="area.html?area=${encodeURIComponent(c.a)}">${c.a}</a><span>/</span><b>${c.n}</b></nav>
      <h1>${c.n}</h1>
      <p>${c.d || ''}</p>
      <div class="selos">
        <span class="selo forte">${carga}</span>
        <span class="selo">${nivel}</span>
        <span class="selo">12 aulas</span>
        <span class="selo">Apostila 16 páginas</span>
        <span class="selo">34 exercícios com gabarito</span>
        <span class="selo">Certificado com QR</span>
      </div>
    </div>
  </section>
  <div class="wrap corpo">
    <div>
      <div class="aprende">
        <h2>O que você vai aprender</h2>
        <ul>${aprende}</ul>
      </div>
      <div class="modulo">
        <div class="modulo-topo">
          <h2>Conteúdo do curso</h2>
          <span id="progressoTxt">0 de ${lista.length} aulas</span>
        </div>
        <div class="barra"><i id="progressoBarra"></i></div>
        <ol class="aulas" id="listaAulas">${aulasHtml}</ol>
      </div>
    </div>
    <div>
      <div class="compra">
        <div class="preco"><b>${brl(9.90)}</b><span>pagamento único</span></div>
        <ul>
          <li>Apostila ilustrada em PDF</li>
          <li>Caderno de exercícios com gabarito comentado</li>
          <li>Acesso imediato, sem assinatura</li>
          <li>Certificado opcional com QR de validação</li>
        </ul>
        <a class="btn laranja" href="${compra}">Comprar com PIX</a>
        <small>Pagamento por PIX. Depois de pagar, você recebe o material e o comprovante vai para o WhatsApp da ANATECH MG.</small>
      </div>
      <div class="entrega">
        <h3>Material do curso</h3>
        <div class="item"><span>Apostila ilustrada</span><a href="pdf/${c.s}.pdf" target="_blank" rel="noopener">Abrir PDF</a></div>
        <div class="item"><span>Exercícios + gabarito</span><a href="exercicios/${c.s}.pdf" target="_blank" rel="noopener">Abrir PDF</a></div>
        <div class="item"><span>Certificado</span><a href="${compra}">Emitir</a></div>
      </div>
    </div>
  </div>
  <section class="relacionados"><div class="wrap">
    <h2>Outros cursos de ${c.a}</h2>
    <div class="rel-grade">
      ${rel.map(x=>'<a class="rel" href="curso.html?c='+encodeURIComponent(x.s)+'"><img src="thumbs/'+x.s+'.webp" alt="" loading="lazy"><div><b>'+x.n+'</b><span>'+(x.h||'20')+' horas</span></div></a>').join('')}
    </div>
  </div></section>`;
  ligarProgresso(slug, lista.length);
}).catch(()=>{
  alvo.innerHTML = '<div class="wrap vazio"><h2>Não consegui carregar o curso</h2><p>Tente recarregar a página.</p></div>';
});
</script>
</body>
</html>
