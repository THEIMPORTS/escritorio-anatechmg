<script>
function zoneOf(nome, papel) {
  var p = String(papel || '') + ' ' + String(nome || '');
  if (p.indexOf('Licitação') >= 0 || p.indexOf('Setor Público') >= 0) return 'licitacao';
  if (p.indexOf('Cibersegurança') >= 0) return 'devsec';
  if (p.indexOf('Software') >= 0 || p.indexOf('Programador') >= 0) return 'software';
  if (p.indexOf('Fiscal') >= 0) return 'fiscal';
  if (p.indexOf('Contábil') >= 0 || p.indexOf('Financeiro') >= 0 || p.indexOf('Financei') >= 0) return 'contabil';
  if (p.indexOf('Jurídico') >= 0) return 'juridico';
  if (p.indexOf('Pesquisa') >= 0) return 'pesquisa';
  if (p.indexOf('Marketing') >= 0 || p.indexOf('Vídeo') >= 0 || p.indexOf('Social') >= 0 || p.indexOf('Rankeamento') >= 0 || p.indexOf('SEO') >= 0 || p.indexOf('Locutor') >= 0 || p.indexOf('Avatar') >= 0 || p.indexOf('Visual') >= 0 || p.indexOf('Roteirista') >= 0) return 'marketing';
  if (p.indexOf('Comercial') >= 0 || p.indexOf('Vendas') >= 0 || p.indexOf('Qualificação') >= 0 || p.indexOf('Captação') >= 0 || p.indexOf('E-commerce') >= 0 || p.indexOf('TikTok') >= 0) return 'comercial';
  if (p.indexOf('Sinal') >= 0 || p.indexOf('Quant') >= 0 || p.indexOf('tráfego') >= 0 || p.indexOf('Tráfego') >= 0 || p.indexOf('Mídia') >= 0 || p.indexOf('mídia') >= 0) return 'trading';
  if (p.indexOf('Suporte') >= 0) return 'suporte';
  if (p.indexOf('Treinamento') >= 0) return 'pesquisa';
  if (p.indexOf('Inovação') >= 0 || p.indexOf('Arsenal') >= 0) return 'pesquisa';
  if (p.indexOf('Engenharia Reversa') >= 0 || p.indexOf('Segurança') >= 0 || p.indexOf('Acessos') >= 0) return 'devsec';
  if (p.indexOf('Educação') >= 0) return 'pesquisa';
  if (p.indexOf('Estrategista') >= 0 || p.indexOf('Monetização') >= 0) return 'marketing';
  if (nome === 'Ana' || nome === 'Conway' || nome === 'Helena' || nome === 'Otto' || nome === 'Monty') return 'diretoria';
  return 'suporte';
}
var ZONAS = {
  diretoria:   { nome: 'DIRETORIA',       cor: '#009CFE' },
  marketing:   { nome: 'MARKETING',       cor: '#f472b6' },
  comercial:   { nome: 'COMERCIAL',       cor: '#25B760' },
  trading:     { nome: 'TRADING & MÍDIA', cor: '#facc15' },
  juridico:    { nome: 'JURÍDICO',        cor: '#38bdf8' },
  contabil:    { nome: 'CONTÁBIL',        cor: '#34d399' },
  fiscal:      { nome: 'FISCAL',          cor: '#a3e635' },
  pesquisa:    { nome: 'PESQUISA & IA',   cor: '#876EA2' },
  devsec:      { nome: 'DEVSEC',          cor: '#FF8100' },
  software:    { nome: 'SOFTWARE',       cor: '#60a5fa' },
  licitacao:   { nome: 'LICITAÇÃO',      cor: '#fbbf24' },
  suporte:     { nome: 'SUPORTE',        cor: '#94a3b8' }
};
var STCOR = { ativo: '#22c55e', aguardando: '#eab308', pausado: '#ef4444', erro: '#ef4444', concluida: '#22c55e', pendente: '#eab308' };
</script>
<script>
var cv = document.getElementById('c2d'), ctx = cv.getContext('2d');
var W = 0, H = 0, modo3d = true;
var view = { z: .5, ox: 0, oy: 0 };
var S = 26;
function iso(x, z, h) {
  var zz = view.z;
  if (modo3d) return { x: view.ox + (x - z) * S * zz, y: view.oy + (x + z) * S * zz * .5 - (h || 0) * S * zz };
  return { x: view.ox + x * S * zz, y: view.oy + z * S * zz - (h || 0) * S * zz * .3 };
}
function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
var arr = null, pinch = null;
cv.addEventListener('pointerdown', function(e) { arr = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e) {
  if (arr) { view.ox = arr.ox + e.clientX - arr.x; view.oy = arr.oy + e.clientY - arr.y; }
  hover(e.clientX, e.clientY);
});
cv.addEventListener('pointerup', function(e) { var mov = arr && (Math.abs(e.clientX - arr.x) + Math.abs(e.clientY - arr.y) > 6); arr = null; if (!mov) clique(e.clientX, e.clientY); });
cv.addEventListener('wheel', function(e) { e.preventDefault(); var f = e.deltaY < 0 ? 1.12 : .89; view.z = Math.max(.14, Math.min(1.6, view.z * f)); }, { passive: false });
cv.addEventListener('touchmove', function(e) {
  if (e.touches.length === 2) {
    var dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (pinch) view.z = Math.max(.14, Math.min(1.6, view.z * (d / pinch)));
    pinch = d;
  }
}, { passive: true });
cv.addEventListener('touchend', function() { pinch = null; });
document.getElementById('btn3d').onclick = function() { modo3d = !modo3d; this.textContent = modo3d ? '3D' : '2D'; this.classList.toggle('on', modo3d); };
</script>
<script>
// ===== construção das salas completas =====
var dados = { agentes: [], vendas: [], tarefas: [], logs: [], decisoes: [] };
var salas = [];  // {zona, x1,z1,x2,z2, mesas[]}
var mesas = [];  // {ag, sala, x, z, ...}
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
var SKINS = ['#f2cfa5', '#e8b083', '#c98a5b', '#9c6a44', '#7a4f31'];
var HAIRS = ['#241a12', '#3a2a1a', '#553d24', '#101010', '#6b4a2a', '#8a6a3a'];
var CAMISAS = ['#2b3a5c', '#3a2f4d', '#24473a', '#4d3524', '#37424f', '#4a2535', '#1f3a4a'];
function montar(agentes) {
  mesas = []; salas = [];
  var porZona = {};
  for (var i = 0; i < agentes.length; i++) {
    var zn = zoneOf(agentes[i].nome, agentes[i].papel);
    (porZona[zn] = porZona[zn] || []).push(agentes[i]);
  }
  var chaves = Object.keys(porZona);
  var bx = 0, bz = 0, col = 0, filaAlt = 0;
  for (var k = 0; k < chaves.length; k++) {
    var zn2 = chaves[k], lista = porZona[zn2];
    var porLinha = Math.min(3, Math.ceil(Math.sqrt(lista.length * 1.4)));
    var linhas = Math.ceil(lista.length / porLinha);
    var larg = porLinha * 4 + 5;
    var prof = linhas * 4 + 5;
    var sala = { zona: zn2, cor: ZONAS[zn2].cor, nome: ZONAS[zn2].nome, x1: bx, z1: bz, x2: bx + larg, z2: bz + prof, mesas: [] };
    salas.push(sala);
    for (var j = 0; j < lista.length; j++) {
      var a = lista[j];
      var hh = hash(a.nome || 'x');
      var m = {
        ag: a, sala: sala,
        x: sala.x1 + 2.5 + (j % porLinha) * 4,
        z: sala.z1 + 2.5 + Math.floor(j / porLinha) * 4,
        pele: SKINS[hh % SKINS.length], cabelo: HAIRS[(hh >> 3) % HAIRS.length], camisa: CAMISAS[(hh >> 5) % CAMISAS.length],
        fone: (hh % 3 === 0), brilho: 0, festeja: 0, falou: null
      };
      mesas.push(m); sala.mesas.push(m);
    }
    col++;
    filaAlt = Math.max(filaAlt, prof + 3);
    bx += larg + 3;
    if (col >= 3) { bx = 0; bz += filaAlt; filaAlt = 0; col = 0; }
  }
  encaixa();
}
function encaixa() {
  var mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9;
  for (var i = 0; i < salas.length; i++) {
    if (salas[i].x1 < mnx) mnx = salas[i].x1; if (salas[i].x2 > mxx) mxx = salas[i].x2;
    if (salas[i].z1 < mnz) mnz = salas[i].z1; if (salas[i].z2 > mxz) mxz = salas[i].z2;
  }
  var cxu = (mnx + mxx) / 2, czu = (mnz + mxz) / 2;
  view.z = .5;
  var ex1 = iso(mnx, mnz, 0), ex2 = iso(mxx, mxz, 0), ex3 = iso(mnx, mxz, 0);
  var fx = Math.min(W / Math.max(200, Math.abs(ex2.x - ex1.x) + 160), H / Math.max(200, ex3.y - ex1.y + 260));
  view.z = Math.max(.16, Math.min(1, fx));
  var p2 = iso(cxu, czu, 0);
  view.ox = W / 2 - p2.x; view.oy = H / 2 - p2.y - 20;
}
</script>

<script>
// ===== hover / clique =====
var hoverMesa = null, sel = null;
function hit(sx, sy) {

  for (var i = 0; i < mesas.length; i++) {

    var d = Math.sqrt((sx - p.x) * (sx - p.x) + (sy - p.y) * (sy - p.y));
    if (d < 2 * S * view.z + 16 && d < md) { md = d; melhor = m; }
  }
  return melhor;
}
function hover(sx, sy) {
  var m = arr ? null : hit(sx, sy);
  if (m !== hoverMesa) { hoverMesa = m; cv.classList.toggle('mao', !!m); }
}
function clique(sx, sy) {
  var m = hit(sx, sy);
  if (!m) return;
  abreCarta(m);
}
function abreCarta(m) {
  sel = m;
  document.getElementById('cta').style.display = 'none';
  var a = m.ag;
  document.getElementById('qEmoji').textContent = a.emoji || '🤖';
  document.getElementById('qNome').textContent = a.nome || 'Agente';
  document.getElementById('qPapel').textContent = a.papel || '—';
  var stEl = document.getElementById('qStatus');

    ht += '<div style="margin:3px 0">▸ <b>' + String(tt.funcao || '').slice(0, 60) + '</b> <span style="color:' + (STCOR[String(tt.status || '').toLowerCase()] || '#8b93a3') + '">(' + (tt.status || '?') + ')</span></div>';
  }

function fechaCarta() { document.getElementById('carta').classList.remove('aberta'); sel = null; }

  document.getElementById('qMsg').style.color = '#4ade80';
  document.getElementById('qMsg').textContent = 'enviando...';

  bm.textContent = m === 'foto' ? 'FOTORREAL' : 'VER 3D';
  document.getElementById('cta').innerHTML = m === 'foto' ? '👆 TOQUE NUM SETOR · <u>VEJA A EQUIPE</u>' : '👆 TOQUE NUM FUNCIONÁRIO · <u>SAIBA MAIS</u>';
  if (m !== 'foto') fechaRoster();
  desenha();
}
document.getElementById('btnmodo').onclick = function() { setaModo(MODO === 'foto' ? 'canvas' : 'foto'); };
var ZCACHE = null;
function chpz() {
  var pz = {};
  for (var q = 0; q < (dados.agentes || []).length; q++) {
    var qzn = zoneOf(dados.agentes[q].nome, dados.agentes[q].papel);
    (pz[qzn] = pz[qzn] || []).push(dados.agentes[q]);
  }
  ZCACHE = pz;
  var zs = Object.keys(pz).sort(function(a, b) { return b.length - a.length; });
  var h = '';
  for (var i = 0; i < zs.length; i++) {
    var k = zs[i];
    var info = ZONAS[k] || { nome: k.toUpperCase(), cor: '#8b93a3' };
    var nAt = 0;
    for (var j = 0; j < pz[k].length; j++) if (String(pz[k][j].status || '').toLowerCase() === 'ativo') nAt++;
    var s = SLOTS[i % SLOTS.length];
    h += '<div class="zchip" style="left:' + s[0] + '%;top:' + s[1] + '%;--zc:' + info.cor + ';--zg:' + hexa(info.cor) + '" onclick="abreRoster(\'' + k + '\')"><span class="zn"></span>' + info.nome + ' <span class="qc">' + nAt + '</span></div>';
  }
  document.getElementById('zonas').innerHTML = h;
}
function hexa(c) { return c + '55'; }
var rosterZ = null;
function abreRoster(k) {
  var info = ZONAS[k] || { nome: k.toUpperCase(), cor: '#8b93a3' };
  rosterZ = k;
  document.getElementById('rosterT').textContent = 'EQUIPE · ' + info.nome;
  document.getElementById('rosterT').style.color = info.cor;
  var h = '';
  var lista = (ZCACHE || {})[k] || [];
  for (var i = 0; i < lista.length; i++) {
    var a = lista[i];
    var st = String(a.status || 'aguardando').toLowerCase();
    h += '<div class="agl" onclick="abreAgFoto(\'' + String(a.nome).replace(/'/g, '') + '\')"><span class="em">' + (a.emoji || '🤖') + '</span><div><div class="nm2">' + a.nome + '</div><div class="pp">' + (a.papel || '—') + '</div></div><span class="st2 ' + st + '">' + st + '</span></div>';
  }
  document.getElementById('rosterL').innerHTML = h || 'sem agentes nesta zona';
  document.getElementById('roster').classList.add('aberto');
}
function fechaRoster() { document.getElementById('roster').classList.remove('aberto'); rosterZ = null; }
function abreAgFoto(nome) {
  for (var i = 0; i < mesas.length; i++) if (String(mesas[i].ag.nome) === nome) { abreCarta(mesas[i]); break; }
}
setaModo('foto');

// ===== dados ao vivo =====
var mercado = { usd: null, btc: null };
function tickMercado() {
  fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL').then(function(r) { return r.json(); }).then(function(d) { if (d && d.USDBRL && d.USDBRL.bid) mercado.usd = parseFloat(d.USDBRL.bid); }).catch(function() {});
  fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=brl').then(function(r) { return r.json(); }).then(function(d) { if (d && d.bitcoin) mercado.btc = d.bitcoin.brl; }).catch(function() {});
}
function chipsMkt() {
  var h = '';
  if (mercado.usd) h += '<span class="chip">USD/BRL <b>R$ ' + mercado.usd.toFixed(2) + '</b></span>';
  if (mercado.btc) h += '<span class="chip">BTC <b>R$ ' + (mercado.btc >= 1000 ? Math.round(mercado.btc / 1000) + 'k' : mercado.btc) + '</b></span>';
  document.getElementById('mkt').innerHTML = h;
}
function hoje() { return new Date().toISOString().slice(0, 10); }
var ultConc = null;
var selParam = new URLSearchParams(location.search).get('sel');
var selTent = 0;
function abreDireto() {
  if (!selParam || sel || !mesas.length || selTent > 10) return;
  selTent++;
  for (var i = 0; i < mesas.length; i++) {
    if (mesas[i].ag && String(mesas[i].ag.nome || '').indexOf(selParam) === 0) { abreCarta(mesas[i]); return; }
  }
}
function tick() {
  fetch('https://ana-a391f94e.base44.app/functions/opsOffice?view=data').then(function(r) { return r.json(); }).then(function(d) {
    if (!d.ok) return;
    var primeira = !dados.agentes.length;
    dados = d;
    document.getElementById('nfunc').textContent = d.agentes.length;
    document.getElementById('relogio').textContent = 'ao vivo · ' + d.agora;
    if (primeira && d.agentes.length) { montar(d.agentes); chpz(); }
    else {
      for (var i = 0; i < mesas.length; i++) {
        for (var j = 0; j < d.agentes.length; j++) if (d.agentes[j].nome === mesas[i].ag.nome) { mesas[i].ag = d.agentes[j]; break; }
      }
    }
    var hq = hoje();
    var venHoje = [], total = 0;
    for (var v = 0; v < (d.vendas || []).length; v++) {
      var vv = d.vendas[v];
      if (String(vv.created_date || '').slice(0, 10) === hq) { venHoje.push(vv); var val = parseFloat(vv.valor); if (!isNaN(val)) total += val; }
    }
    var porAg = {};
    for (var t = 0; t < (d.tarefas || []).length; t++) {
      var tt2 = d.tarefas[t];
      if (String(tt2.created_date || '').slice(0, 10) === hq && String(tt2.status || '').toLowerCase() === 'concluida') {
        porAg[tt2.agente] = (porAg[tt2.agente] || 0) + 1;
      }
    }
    var rk = Object.keys(porAg).sort(function(a, b) { return porAg[b] - porAg[a]; }).slice(0, 3);
    var html = '<div class="rt">RESULTADO DE ESCRITÓRIO HOJE</div>';
    if (venHoje.length) {
      html += '<div class="rv">+R$ ' + total.toFixed(2).replace('.', ',') + '</div>';
      html += '<div class="rvenda"><b>' + venHoje.length + '</b> venda(s) registrada(s) hoje</div>';
    } else {
      html += '<div class="rv nu">' + (rk.length ? rk.length + ' entregas' : 'em operação') + '</div>';
      html += '<div class="rvenda">vendas do dia aparecem aqui em tempo real</div>';
    }
    html += '<div class="rk">';
    var pos = ['1º', '2º', '3º'];
    for (var r2 = 0; r2 < 3; r2++) {
      var nm = rk[r2] ? String(rk[r2]).split(' ')[0] : '—';
      var qv = rk[r2] ? porAg[rk[r2]] + ' ent' : '…';
      html += '<div class="c"><div class="p">' + pos[r2] + '</div><div class="n">' + nm + '</div><div class="v">' + qv + '</div></div>';
    }
    html += '</div>';
    document.getElementById('res').innerHTML = html;
    document.getElementById('res').style.display = 'block';
    var linhas = [];
    var dec = d.decisoes || [], scn = d.scans || [], pos2 = d.posicoes || [], tar = d.tarefas || [], lg = d.logs || [];
    for (var i2 = 0; i2 < Math.min(2, dec.length); i2++) linhas.push(['dec', '📈 QuantBot: ' + (dec[i2].acao || '') + ' ' + (dec[i2].symbol || '')]);
    if (scn.length) linhas.push(['in', '🔍 Scan: ' + (scn[0].symbol || '')]);
    for (var i3 = 0; i3 < Math.min(2, pos2.length); i3++) linhas.push(['ok', '💰 ' + (pos2[i3].symbol || '') + ' ' + (pos2[i3].status || '')]);
    for (var i4 = 0; i4 < Math.min(2, tar.length); i4++) linhas.push(['in', '📋 ' + (tar[i4].agente || '?') + ': tarefa ' + (tar[i4].status || '?')]);
    for (var i5 = 0; i5 < Math.min(2, lg.length); i5++) linhas.push([lg[i5].tipo === 'erro' ? 'er' : (lg[i5].tipo === 'sucesso' ? 'ok' : 'in'), '💬 ' + (lg[i5].agente || 'Sistema') + ': ' + (lg[i5].evento || '')]);
    var fh = '';
    var lin2 = linhas.slice(0, 6);
    for (var i6 = 0; i6 < lin2.length; i6++) { var s2 = lin2[i6][1]; fh += '<div class="e"><span class="' + lin2[i6][0] + '">●</span> <b>' + s2.split(':')[0] + ':</b>' + s2.split(':').slice(1).join(':') + '</div>'; }
    document.getElementById('flinhas').innerHTML = fh || '<div class="e">aguardando eventos...</div>';
    for (var i7 = 0; i7 < tar.length; i7++) {
      var t9 = tar[i7];
      if (String(t9.status || '').toLowerCase() === 'concluida' && t9.id !== ultConc) {
        ultConc = t9.id;
        for (var i8 = 0; i8 < mesas.length; i8++) if (mesas[i8].ag && mesas[i8].ag.nome === t9.agente) { mesas[i8].festeja = Date.now() + 6000; mesas[i8].brilho = 1; mesas[i8].falou = { txt: '✅ entreguei!', ate: Date.now() + 4000 }; }
      }
    }
  }).catch(function() {});
}
var FALAS = ['tô nisso 🔥', 'bora que dá', 'checando os dados…', 'missão do dia 🚀', 'foco total 💪', 'mais uma pro quadro ✅'];
function ambiente() {
  var vivos = [];
  for (var i = 0; i < mesas.length; i++) vivos.push(mesas[i]);
  if (vivos.length) {
    var m = vivos[Math.floor(Math.random() * vivos.length)];
    m.falou = { txt: FALAS[Math.floor(Math.random() * FALAS.length)], ate: Date.now() + 3800 };
    m.brilho = Math.max(m.brilho, .5);
  }
}
document.getElementById('diag').textContent = 'escritório 3D carregando…';
document.getElementById('diag').classList.add('mostra');
setTimeout(function() { document.getElementById('diag').classList.remove('mostra'); }, 9000);
tickMercado(); setInterval(tickMercado, 120000); setInterval(chipsMkt, 5000);
tick(); setInterval(tick, 20000);
setInterval(ambiente, 7000);
setInterval(abreDireto, 1500);
requestAnimationFrame(desenha);
</script>
