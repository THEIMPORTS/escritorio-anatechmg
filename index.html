<script>
// ===== zonas por setor (cores da marca + neon) =====
function zoneOf(nome, papel) {
  var p = String(papel || '') + ' ' + String(nome || '');
  if (p.indexOf('Licitação') >= 0 || p.indexOf('Setor Público') >= 0) return 'licitacao';
  if (p.indexOf('Cibersegurança') >= 0) return 'devsec';
  if (p.indexOf('Software') >= 0 || p.indexOf('Programador') >= 0) return 'software';
  if (p.indexOf('Fiscal') >= 0) return 'fiscal';
  if (p.indexOf('Contábil') >= 0 || p.indexOf('Financeiro') >= 0 || p.indexOf('Financei') >= 0) return 'contabil';
  if (p.indexOf('Jurídico') >= 0) return 'juridico';
  if (p.indexOf('Pesquisa') >= 0) return 'pesquisa';
  if (p.indexOf('Marketing') >= 0 || p.indexOf('Vídeo') >= 0 || p.indexOf('Social') >= 0 || p.indexOf('Rankeamento') >= 0 || p.indexOf('SEO') >= 0 || p.indexOf('Locutor') >= 0 || p.indexOf('Avatar') >= 0 || p.indexOf('Visual') >= 0 || p.indexOf('Roteirista') >= 0) return 'marketing';
  if (p.indexOf('Comercial') >= 0 || p.indexOf('Vendas') >= 0 || p.indexOf('Qualificação') >= 0 || p.indexOf('Captação') >= 0 || p.indexOf('E-commerce') >= 0 || p.indexOf('TikTok') >= 0) return 'comercial';
  if (p.indexOf('Sinal') >= 0 || p.indexOf('Quant') >= 0 || p.indexOf('tráfego') >= 0 || p.indexOf('Tráfego') >= 0 || p.indexOf('mídia') >= 0 || p.indexOf('Mídia') >= 0) return 'trading';
  if (p.indexOf('Suporte') >= 0) return 'suporte';
  if (p.indexOf('Treinamento') >= 0) return 'pesquisa';
  if (p.indexOf('Inovação') >= 0 || p.indexOf('Arsenal') >= 0) return 'pesquisa';
  if (p.indexOf('Engenharia Reversa') >= 0 || p.indexOf('Segurança') >= 0 || p.indexOf('Acessos') >= 0) return 'devsec';
  if (p.indexOf('Educação') >= 0) return 'pesquisa';
  if (p.indexOf('Estrategista') >= 0 || p.indexOf('Monetização') >= 0) return 'marketing';
  if (nome === 'Ana' || nome === 'Conway' || nome === 'Helena' || nome === 'Otto' || nome === 'Monty') return 'diretoria';
  return 'suporte';
}
var ZONAS = {
  diretoria:   { nome: 'DIRETORIA',       cor: '#009CFE' },
  marketing:   { nome: 'MARKETING',       cor: '#f472b6' },
  comercial:   { nome: 'COMERCIAL',       cor: '#25B760' },
  trading:     { nome: 'TRADING & MÍDIA', cor: '#facc15' },
  juridico:    { nome: 'JURÍDICO',        cor: '#38bdf8' },
  contabil:    { nome: 'CONTÁBIL',        cor: '#34d399' },
  fiscal:      { nome: 'FISCAL',          cor: '#a3e635' },
  pesquisa:    { nome: 'PESQUISA & IA',   cor: '#876EA2' },
  devsec:      { nome: 'DEVSEC',          cor: '#FF8100' },
  software:    { nome: 'SOFTWARE',       cor: '#60a5fa' },
  licitacao:   { nome: 'LICITAÇÃO',      cor: '#fbbf24' },
  suporte:     { nome: 'SUPORTE',        cor: '#94a3b8' }
};
var STCOR = { ativo: '#22c55e', aguardando: '#eab308', pausado: '#ef4444', erro: '#ef4444', concluida: '#22c55e', pendente: '#eab308' };
</script>
<script>
// ===== câmera =====
var cv = document.getElementById('c2d'), ctx = cv.getContext('2d');
var W = 0, H = 0, modo3d = true;
var view = { z: .5, ox: 0, oy: 0 };
var S = 26;
function iso(x, z, h) {
  var zz = view.z;
  if (modo3d) return { x: view.ox + (x - z) * S * zz, y: view.oy + (x + z) * S * zz * .5 - (h || 0) * S * zz };
  return { x: view.ox + x * S * zz, y: view.oy + z * S * zz - (h || 0) * S * zz * .3 };
}
function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();
// pan / zoom
var arr = null, pinch = null, mexeu = false;
cv.addEventListener('pointerdown', function(e) { arr = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', function(e) {
  if (arr) { view.ox = arr.ox + e.clientX - arr.x; view.oy = arr.oy + e.clientY - arr.y; mexeu = true; }
  hover(e.clientX, e.clientY);
});
cv.addEventListener('pointerup', function(e) { var mov = arr && (Math.abs(e.clientX - arr.x) + Math.abs(e.clientY - arr.y) > 6); arr = null; if (!mov) clique(e.clientX, e.clientY); });
cv.addEventListener('wheel', function(e) { e.preventDefault(); var f = e.deltaY < 0 ? 1.12 : .89; view.z = Math.max(.14, Math.min(1.6, view.z * f)); mexeu = true; }, { passive: false });
cv.addEventListener('touchmove', function(e) {
  if (e.touches.length === 2) {
    var dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (pinch) { view.z = Math.max(.14, Math.min(1.6, view.z * (d / pinch))); mexeu = true; }
    pinch = d;
  }
}, { passive: true });
cv.addEventListener('touchend', function() { pinch = null; });
document.getElementById('btn3d').onclick = function() { modo3d = !modo3d; this.textContent = modo3d ? '3D' : '2D'; this.classList.toggle('on', modo3d); };
</script>
<script>
// ===== funcionários e mesas =====
var dados = { agentes: [], vendas: [], tarefas: [], logs: [], decisoes: [] };
var mesas = [];   // {ag, x, z, zona, telas(screen center cache), brilho, festeja}
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
var SKINS = ['#f2cfa5', '#e8b083', '#c98a5b', '#9c6a44', '#7a4f31'];
var HAIRS = ['#241a12', '#3a2a1a', '#553d24', '#101010', '#6b4a2a'];
function montar(agentes) {
  mesas = [];
  var porZona = {};
  for (var i = 0; i < agentes.length; i++) {
    var zn = zoneOf(agentes[i].nome, agentes[i].papel);
    (porZona[zn] = porZona[zn] || []).push(agentes[i]);
  }
  var chaves = Object.keys(porZona).sort(function(a, b) { return porZona[b].length - porZona[a].length; });
  var bx = 0, bz = 0, filaAlt = 0, col = 0;
  for (var k = 0; k < chaves.length; k++) {
    var zn2 = chaves[k], lista = porZona[zn2];
    var porLinha = 4;
    var linhas = Math.ceil(lista.length / porLinha);
    var largura = Math.min(lista.length, porLinha) * 3.6 + 2;
    for (var j = 0; j < lista.length; j++) {
      var a = lista[j];
      var hh = hash(a.nome || 'x');
      mesas.push({
        ag: a, zona: zn2,
        x: bx + (j % porLinha) * 3.6 + 1.4,
        z: bz + Math.floor(j / porLinha) * 3.6 + 1.2,
        pele: SKINS[hh % SKINS.length], cabelo: HAIRS[(hh >> 3) % HAIRS.length],
        brilho: 0, festeja: 0, falou: null
      });
    }
    mesas.push({ zonaLabel: ZONAS[zn2].nome, cor: ZONAS[zn2].cor, x: bx + largura / 2 - .5, z: bz + linhas * 3.6 + 1.6 });
    col++;
    filaAlt = Math.max(filaAlt, linhas * 3.6 + 3.4);
    bx += largura + 2.4;
    if (col >= 4) { bx = 0; bz += filaAlt + 2.2; filaAlt = 0; col = 0; }
  }
  encaixa();
}
function encaixa() {
  var mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9;
  for (var i = 0; i < mesas.length; i++) { var m = mesas[i]; if (m.zonaLabel) continue; if (m.x < mnx) mnx = m.x; if (m.x > mxx) mxx = m.x; if (m.z < mnz) mnz = m.z; if (m.z > mxz) mxz = m.z; }
  var cxu = (mnx + mxx) / 2, czu = (mnz + mxz) / 2;
  var zAntes = view.z;
  view.z = .5;
  var p = iso(cxu, czu, 0);
  view.ox = W / 2 - p.x; view.oy = H / 2 - p.y - 10;
  var ex1 = iso(mnx, mnz, 0), ex2 = iso(mxx, mxz, 0);
  var fx = Math.min(W / Math.max(160, Math.abs(ex2.x - ex1.x) + 140), H / Math.max(160, Math.abs(ex2.y - ex1.y) + 240));
  view.z = Math.max(.16, Math.min(1, fx));
  var p2 = iso(cxu, czu, 0);
  view.ox = W / 2 - p2.x; view.oy = H / 2 - p2.y - 10;
  void zAntes;
}
</script>
<script>
// ===== desenho =====
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function desenha() {
  ctx.clearRect(0, 0, W, H);
  // fundo com brilho ambiente
  var g = ctx.createRadialGradient(W * .32, H * .3, 40, W * .32, H * .3, Math.max(W, H) * .7);
  g.addColorStop(0, '#0d1322'); g.addColorStop(1, '#07090f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  var amb = ctx.createRadialGradient(W * .75, H * .7, 10, W * .75, H * .7, W * .4);
  amb.addColorStop(0, 'rgba(135,110,162,.10)'); amb.addColorStop(1, 'rgba(135,110,162,0)');
  ctx.fillStyle = amb; ctx.fillRect(0, 0, W, H);
  // grade do piso
  ctx.strokeStyle = 'rgba(70,90,140,.10)'; ctx.lineWidth = 1;
  var gx = -6, gz = -6;
  for (var i = 0; i < 40; i++) {
    var a = iso(gx + i * 3.6, -6, 0), b = iso(gx + i * 3.6, 60, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    var c = iso(-6, gz + i * 3.6, 0), d = iso(80, gz + i * 3.6, 0);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
  // ordena por profundidade
  var ord = mesas.slice().sort(function(a, b) { return (a.x + a.z) - (b.x + b.z); });
  for (var k = 0; k < ord.length; k++) {
    var m = ord[k];
    if (m.zonaLabel) { desenhaLabel(m); continue; }
    desenhaMesa(m);
  }
  requestAnimationFrame(desenha);
}
function desenhaLabel(m) {
  var p = iso(m.x, m.z, 0);
  var zz = view.z;
  ctx.save();
  ctx.font = '800 ' + Math.max(9, 15 * zz) + 'px Segoe UI,system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.13)';
  ctx.textAlign = 'center';
  ctx.shadowColor = m.cor; ctx.shadowBlur = 12;
  ctx.fillText(m.zonaLabel, p.x, p.y);
  ctx.restore();
}
function desenhaMesa(m) {
  var st = String(m.ag.status || 'aguardando').toLowerCase();
  var cor = ZONAS[m.zona].cor;
  var hover = (hoverMesa === m);
  var zz = view.z;
  var base = iso(m.x, m.z, 0);
  var s = S * zz;
  // base neon no chão
  ctx.save();
  var bw = 2.7 * s, bh = modo3d ? 1.35 * s : 2.7 * s;
  var bx = base.x - bw / 2, by = base.y - bh / 2 - (modo3d ? bh * .18 : 0);
  var glow = .5 + m.brilho + (m.festeja > Date.now() ? .6 : 0);
  ctx.shadowColor = cor; ctx.shadowBlur = (18 + m.brilho * 26) * zz;
  ctx.globalAlpha = .16 + m.brilho * .3 + (hover ? .18 : 0);
  ctx.fillStyle = cor;
  if (modo3d) {
    // losango
    var pts = [[m.x - 1.35, m.z - 1.35], [m.x + 1.35, m.z - 1.35], [m.x + 1.35, m.z + 1.35], [m.x - 1.35, m.z + 1.35]];
    ctx.beginPath();
    for (var pi = 0; pi < 4; pi++) { var q = iso(pts[pi][0], pts[pi][1], 0); if (pi === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); }
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = .8; ctx.lineWidth = Math.max(1, 2.2 * zz); ctx.strokeStyle = cor; ctx.stroke();
  } else {
    rrect(bx, by, bw, bh, 8 * zz); ctx.fill();
    ctx.globalAlpha = .8; ctx.lineWidth = Math.max(1, 2.2 * zz); ctx.strokeStyle = cor; ctx.stroke();
  }
  ctx.restore();
  // mesa
  var top = iso(m.x, m.z, modo3d ? 1.0 : 0.9);
  ctx.fillStyle = '#171e2e';
  ctx.strokeStyle = '#2b3550'; ctx.lineWidth = 1;
  if (modo3d) {
    var d1 = iso(m.x - .8, m.z - .45, 1.0), d2 = iso(m.x + .8, m.z - .45, 1.0), d3 = iso(m.x + .8, m.z + .45, 1.0), d4 = iso(m.x - .8, m.z + .45, 1.0);
    // frente
    var f1 = iso(m.x - .8, m.z + .45, 0), f2 = iso(m.x + .8, m.z + .45, 0);
    ctx.beginPath(); ctx.moveTo(f1.x, f1.y); ctx.lineTo(f2.x, f2.y); ctx.lineTo(d3.x, d3.y); ctx.lineTo(d4.x, d4.y); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d1.x, d1.y); ctx.lineTo(d2.x, d2.y); ctx.lineTo(d3.x, d3.y); ctx.lineTo(d4.x, d4.y); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    var tw = 1.6 * s;
    rrect(top.x - tw / 2, top.y - tw * .28, tw, tw * .56, 4); ctx.fill(); ctx.stroke();
  }
  // monitor
  var mo = iso(m.x, m.z - (modo3d ? .18 : 0), modo3d ? 1.75 : 1.7);
  ctx.save();
  ctx.shadowColor = '#00F0FF'; ctx.shadowBlur = 10 * zz;
  ctx.fillStyle = '#0b1420';
  var mw = .95 * s * (modo3d ? 1 : 1), mh = .55 * s;
  if (modo3d) {
    var moA = iso(m.x - .45, m.z - .6, 1.75), moB = iso(m.x + .45, m.z - .6, 1.75);
    ctx.beginPath(); ctx.moveTo(moA.x, moA.y); ctx.lineTo(moB.x, moB.y - mh * .2); ctx.lineTo(moB.x + (moB.x - moA.x) * .0 + 3 * zz, moB.y - mh * .2 + mh * .1); ctx.closePath();
    ctx.fillStyle = '#7dd3fc'; ctx.globalAlpha = .55; ctx.fill(); ctx.globalAlpha = 1;
  } else {
    rrect(mo.x - mw / 2, mo.y - mh / 2, mw, mh, 3); ctx.fill();
    ctx.fillStyle = 'rgba(125,211,252,.5)'; rrect(mo.x - mw / 2 + 2, mo.y - mh / 2 + 2, mw - 4, mh - 4, 2); ctx.fill();
  }
  ctx.restore();
  // personagem sentado (atrás da mesa)
  var pc = iso(m.x, m.z + (modo3d ? .55 : .3), modo3d ? 1.15 : 1.1);
  var r = .34 * s;
  // corpo
  ctx.fillStyle = '#232c40';
  ctx.beginPath(); ctx.ellipse(pc.x, pc.y + r * .75, r * 1.05, r * 1.25, 0, 0, Math.PI * 2); ctx.fill();
  // cabeça
  ctx.fillStyle = m.pele;
  ctx.beginPath(); ctx.arc(pc.x, pc.y, r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = m.cabelo;
  ctx.beginPath(); ctx.arc(pc.x, pc.y - r * .18, r * .92, Math.PI, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.arc(pc.x, pc.y, r + 2.5 * zz, 0, Math.PI * 2);

  ctx.shadowColor = STCOR[st] || STCOR.aguardando; ctx.shadowBlur = 6 * zz; ctx.stroke(); ctx.shadowBlur = 0;

  var nome = String(m.ag.nome || '?').replace(/\s*\(.*\)/, '');

  var np = iso(m.x, m.z, 0);
  ctx.font = '700 ' + Math.max(8, 10.5 * zz) + 'px Segoe UI,system-ui,sans-serif';
  ctx.textAlign = 'center';
  var tw2 = ctx.measureText(nome).width;
  ctx.fillStyle = hover ? 'rgba(10,14,24,.95)' : 'rgba(9,12,20,.8)';
  rrect(np.x - tw2 / 2 - 5, np.y + 4, tw2 + 10, 15 * zz + 5, 6); ctx.fill();
  ctx.fillStyle = hover ? '#ffffff' : '#c9d3e8';
  ctx.fillText(nome, np.x, np.y + 15 * zz);
  // balão de fala
  if (m.falou && Date.now() < m.falou.ate) {
    var bp = iso(m.x, m.z + .4, modo3d ? 2.4 : 2.2);
    ctx.font = '600 ' + Math.max(8, 10 * zz) + 'px Segoe UI,sans-serif';
    var txt = m.falou.txt;
    var tw3 = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(240,244,255,.96)';
    rrect(bp.x - tw3 / 2 - 7, bp.y - 11, tw3 + 14, 17 * zz + 4, 7); ctx.fill();
    ctx.fillStyle = '#0b1220';
    ctx.fillText(txt, bp.x, bp.y + 1);
  }
  // decaimento do brilho
  if (m.brilho > 0) m.brilho = Math.max(0, m.brilho - .02);
}

<script>
// ===== hover / clique =====
var hoverMesa = null, ultimas = [];
function telaMesa(m) { var p = iso(m.x, m.z, 0); return { x: p.x, y: p.y }; }
function hit(sx, sy) {
  var melhor = null, md = 1e9;
  for (var i = 0; i < mesas.length; i++) {

    var p = telaMesa(m);
    var d = Math.sqrt((sx - p.x) * (sx - p.x) + (sy - p.y) * (sy - p.y));
    if (d < 2.2 * S * view.z + 14 && d < md) { md = d; melhor = m; }
  }
  return melhor;
}
function hover(sx, sy) {
  var m = arr ? null : hit(sx, sy);

}
